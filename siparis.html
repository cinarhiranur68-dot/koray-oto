<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siparişi Tamamla</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">🚗 Koray Oto</div>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="sepet.html">Sepet</a>
    </nav>
</header>

<section class="products">

    <h2>🛒 Siparişi Tamamla</h2>

<div class="order-summary">

    <h3>📦 Sipariş Özeti</h3>

    <div id="order-items"></div>

    <h3 id="order-total"></h3>

</div>









    <form class="order-form">

        <input type="text" placeholder="Ad Soyad" required>

        <input type="tel" placeholder="Telefon Numarası" required>

        <input type="email" placeholder="E-posta">

        <textarea placeholder="Adresiniz" rows="5" required></textarea>

        <select required>
            <option>Kapıda Ödeme</option>
            <option>Kredi Kartı</option>
            <option>Havale / EFT</option>
        </select>

        <button type="submit" class="checkout-btn">
            ✅ Siparişi Onayla
        </button>

    </form>

</section>

<script src="script.js"></script>

</body>
</html>
